
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HourPilot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <h1 class="logo">Hour<span>Pilot</span></h1>

            <p class="side-label">WORKSPACE</p>

            <nav>
                <button class="nav-item active" data-page="home">
                    ⌂ Home
                </button>

                <button class="nav-item" data-page="planner">
                    ▦ Planner
                </button>

                <button class="nav-item" data-page="tasks">
                    ☷ Tasks
                </button>

                <button class="nav-item" data-page="analytics">
                    ▥ Analytics
                </button>

                <button class="nav-item" data-page="settings">
                    ⚙ Settings
                </button>
            </nav>

            <div class="sidebar-bottom">
                One hour at a time.<br>
                <span>HOURPILOT • MVP</span>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <p class="eyebrow">YOUR PERSONAL PLANNER</p>
                    <h1 id="page-title">Good day.</h1>
                </div>

                <span id="today-date" class="today"></span>
            </header>

            <div id="page-content">
                <!-- Dynamic page content loads here -->
            </div>
        </main>
    </div>

    <!-- Hidden SVG filter used by visual effects -->
    <svg
        aria-hidden="true"
        style="position: absolute; width: 0; height: 0; pointer-events: none;"
    >
        <defs>
            <filter
                id="liquid-refraction"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
            >
                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.015"
                    numOctaves="3"
                    result="noise"
                />

                <feDisplacementMap
                    in="SourceGraphic"
                    in2="noise"
                    scale="28"
                    xChannelSelector="R"
                    yChannelSelector="G"
                    result="displacement"
                />

                <feComposite
                    in="SourceGraphic"
                    in2="displacement"
                    operator="over"
                />
            </filter>
        </defs>
    </svg>

    <script src="script.js"></script>
</body>
</html>
